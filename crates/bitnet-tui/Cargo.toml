[package]
name = "bitnet-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "BitNet terminal interface"

[dependencies]
bitnet-core.workspace = true
bitnet-launcher.workspace = true
bitnet-runtime.workspace = true
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", default-features = false, features = ["event-stream", "windows"] }
futures-util = { version = "0.3", default-features = false }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
tokio.workspace = true
