[package]
name = "iced-mcp"
version = "0.3.1"
edition = "2021"
license = "MIT"

[dependencies]
iced = { git = "https://github.com/iced-rs/iced.git", rev = "bb97596ddb79c23de7a2393a4671aa64a4146e34", default-features = false, features = ["advanced", "tokio"] }
iced_winit = { git = "https://github.com/iced-rs/iced.git", rev = "bb97596ddb79c23de7a2393a4671aa64a4146e34", default-features = false }
iced-mcp-protocol = { path = "protocol" }
base64 = "0.22"
futures = "0.3"
png = "0.17"
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.5.1"
objc2 = "0.5.2"
objc2-foundation = { version = "0.2.2", default-features = false, features = ["std", "block2", "NSNotification", "NSObject", "NSOperation", "NSProcessInfo", "NSString"] }
objc2-app-kit = { version = "0.2.2", default-features = false, features = ["std", "libc", "NSApplication", "NSEvent", "NSResponder", "NSRunningApplication", "NSWorkspace"] }
