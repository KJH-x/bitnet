[package]
name = "bitnet-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.93"
description = "BitNet software-rendered desktop interface"

[dependencies]
bitnet-core.workspace = true
bitnet-runtime.workspace = true
# Experimental software renderer from Iced PR #3306.
iced = { git = "https://github.com/iced-rs/iced.git", rev = "3ad0fe9402166474cbe8217b439e4901f63bc124", default-features = false, features = ["vello-cpu", "tokio", "advanced", "advanced-shaping"] }
serde_json.workspace = true
zeroize.workspace = true

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = "0.21"
notify-rust = { version = "=4.17.0", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
iced = { git = "https://github.com/iced-rs/iced.git", rev = "3ad0fe9402166474cbe8217b439e4901f63bc124", default-features = false, features = ["x11", "wayland", "linux-theme-detection"] }
ksni = "0.3.7"
notify-rust = { version = "=4.17.0", default-features = false, features = ["z-with-tokio"] }
tokio.workspace = true

[[bin]]
name = "bitnet-gui"
path = "src/main.rs"
