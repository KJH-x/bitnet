[package]
name = "bitnet-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "BitNet software-rendered desktop interface"

[dependencies]
bitnet-core.workspace = true
bitnet-runtime.workspace = true
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "tokio", "advanced-shaping"] }
serde_json.workspace = true
zeroize.workspace = true

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = "0.21"
notify-rust = { version = "=4.17.0", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "tokio", "advanced-shaping", "x11", "wayland", "linux-theme-detection"] }
notify-rust = { version = "=4.17.0", default-features = false, features = ["z-with-tokio"] }

[[bin]]
name = "bitnet-gui"
path = "src/main.rs"
