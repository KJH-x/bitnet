[package]
name = "bitnet-platform"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bitnet-core.workspace = true
serde_json.workspace = true
zeroize.workspace = true
aes-gcm = "0.10"
getrandom = "0.2"
base64 = "0.22"
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_NetworkManagement_WiFi", "Win32_System_LibraryLoader"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
