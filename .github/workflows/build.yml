name: Build and package
on:
  push:
    branches: ['**', '!experiment/iced-vello-cpu']
  pull_request:
  workflow_dispatch:
    inputs:
      package:
        description: "Build development packages (requires a new version)"
        type: boolean
        default: false
  workflow_call:
    inputs:
      production:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    environment: ${{ inputs.production && 'release' || 'development' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, target: x86_64-pc-windows-msvc }
          - { arch: x86, target: i686-pc-windows-msvc }
          - { arch: arm64, target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --target ${{ matrix.target }} -- -D warnings
      - if: matrix.arch == 'x64'
        run: cargo test --workspace
      - if: inputs.production || inputs.package
        run: ./scripts/bootstrap-tools.ps1
      - if: inputs.production || inputs.package
        run: ./scripts/build-wix-source.ps1 -PlatformToolset v143
      - if: inputs.production
        run: python scripts/prepare-ci-signing.py
        env:
          BITNET_SIGNING_SECRET: ${{ secrets.BITNET_SIGNING_SECRET }}
          BITNET_SIGNING_PUBLIC: ${{ vars.BITNET_SIGNING_PUBLIC }}
      - if: inputs.production
        run: ./scripts/package-windows.ps1 -Arch ${{ matrix.arch }}
        env:
          BITNET_UPDATE_FEED: ${{ vars.BITNET_UPDATE_FEED }}
      - if: inputs.package && !inputs.production
        run: ./scripts/package-windows.ps1 -Arch ${{ matrix.arch }} -Development
      - name: Resolve package version
        if: inputs.production || inputs.package
        id: version
        shell: bash
        run: echo "version=$(python3 scripts/package-version.py)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: inputs.production || inputs.package
        with:
          name: windows-${{ matrix.arch }}-${{ inputs.production && 'production' || 'development' }}
          path: dist/BitNet-${{ steps.version.outputs.version }}-windows-${{ matrix.arch }}/
  linux:
    runs-on: ${{ matrix.runner }}
    environment: ${{ inputs.production && 'release' || 'development' }}
    env:
      OPENSSL_STATIC: '1'
      DEVELOPMENT: ${{ inputs.production && '0' || '1' }}
      BITNET_UPDATE_FEED: ${{ inputs.production && vars.BITNET_UPDATE_FEED || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, arch: amd64 }
          - { runner: ubuntu-22.04-arm, arch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config libx11-dev libxkbcommon-dev libwayland-dev libfontconfig1-dev minisign rpm squashfs-tools
      - if: inputs.production
        run: python3 scripts/prepare-ci-signing.py
        env:
          BITNET_SIGNING_SECRET: ${{ secrets.BITNET_SIGNING_SECRET }}
          BITNET_SIGNING_PUBLIC: ${{ vars.BITNET_SIGNING_PUBLIC }}
      - if: inputs.package && !inputs.production
        run: sh scripts/prepare-signing.sh --development && cat .local/release-keys/public.env >> "$GITHUB_ENV"
      - if: inputs.production || inputs.package
        run: sh scripts/bootstrap-appimage.sh >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: python3 scripts/fingerprint-source.py --write .local/build-source-before.json
      - run: cargo build --release --workspace --bins
      - run: python3 scripts/fingerprint-source.py --check .local/build-source-before.json --write target/release/bitnet-build-source.json
      - if: inputs.production || inputs.package
        run: EXTRA_FORMATS=1 ARCH=${{ matrix.arch }} sh scripts/package-linux.sh
      - name: Resolve package version
        if: inputs.production || inputs.package
        id: version
        shell: bash
        run: echo "version=$(python3 scripts/package-version.py)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: inputs.production || inputs.package
        with:
          name: linux-${{ matrix.arch }}-${{ inputs.production && 'production' || 'development' }}
          path: dist/BitNet-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}/
  linux-i386:
    if: inputs.package && !inputs.production
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build on Debian 12 i386 baseline
        run: |
          docker run --rm --platform linux/386 -v "$PWD:/work" -w /work i386/debian:12 sh -ec '
            apt-get update
            apt-get install -y curl ca-certificates git build-essential pkg-config libssl-dev libx11-dev libxkbcommon-dev libwayland-dev libfontconfig1-dev minisign python3
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
            sh /tmp/rustup.sh -y --profile minimal --component rustfmt --component clippy
            . /root/.cargo/env
            sh scripts/prepare-signing.sh --development
            set -a; . .local/release-keys/public.env; set +a
            cargo fmt --all -- --check
            cargo clippy --workspace --all-targets -- -D warnings
            cargo test --workspace
            python3 scripts/fingerprint-source.py --write .local/build-source-before.json
            cargo build --release --workspace --bins
            python3 scripts/fingerprint-source.py --check .local/build-source-before.json --write target/release/bitnet-build-source.json
            DEVELOPMENT=1 ARCH=i386 sh scripts/package-linux.sh'
      - name: Resolve package version
        if: inputs.production || inputs.package
        id: version
        shell: bash
        run: echo "version=$(python3 scripts/package-version.py)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: inputs.production || inputs.package
        with:
          name: linux-i386-development
          path: dist/BitNet-${{ steps.version.outputs.version }}-linux-i386/
  macos:
    runs-on: ${{ matrix.runner }}
    environment: ${{ inputs.production && 'release' || 'development' }}
    env:
      DEVELOPMENT: ${{ inputs.production && '0' || '1' }}
      BITNET_UPDATE_FEED: ${{ inputs.production && vars.BITNET_UPDATE_FEED || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15-intel, arch: x86_64 }
          - { runner: macos-15, arch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: brew install minisign
      - if: inputs.production
        run: python3 scripts/prepare-ci-signing.py
        env:
          BITNET_SIGNING_SECRET: ${{ secrets.BITNET_SIGNING_SECRET }}
          BITNET_SIGNING_PUBLIC: ${{ vars.BITNET_SIGNING_PUBLIC }}
      - if: inputs.package && !inputs.production
        run: sh scripts/prepare-signing.sh --development && cat .local/release-keys/public.env >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: python3 scripts/fingerprint-source.py --write .local/build-source-before.json
      - run: cargo build --release --workspace --bins
      - run: python3 scripts/fingerprint-source.py --check .local/build-source-before.json --write target/release/bitnet-build-source.json
      - if: inputs.production || inputs.package
        run: ARCH=${{ matrix.arch }} sh scripts/package-macos.sh
      - name: Resolve package version
        if: inputs.production || inputs.package
        id: version
        shell: bash
        run: echo "version=$(python3 scripts/package-version.py)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: inputs.production || inputs.package
        with:
          name: macos-${{ matrix.arch }}-${{ inputs.production && 'production' || 'development' }}
          path: dist/BitNet-${{ steps.version.outputs.version }}-macos-${{ matrix.arch }}/
